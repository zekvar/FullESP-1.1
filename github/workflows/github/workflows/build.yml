name: Сборка APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Распаковать проект
        run: unzip -q FullESPTrainingDemo_AndroidStudio.zip -d extracted

      - name: Собрать APK
        run: gradle -p extracted/FullESPTrainingDemo assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: FULL-ESP-APK
          path: extracted/FullESPTrainingDemo/app/build/outputs/apk/debug/app-debug.apk
